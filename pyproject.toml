[build-system]
requires = [
    "setuptools>=69",
    "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "graphion"
version = "0.0.2"

description = "A research framework for graph-based partitioning algorithms."
readme = "README.md"

requires-python = ">=3.11"

authors = [
    { name = "Mohsen Sahrayi", email = "m.sahrayi.a@gmail.com" },
]

license = { file = "LICENSE" }

keywords = [
    "graph",
    "graph-partitioning",
    "graph-clustering",
    "community-detection",
    "network-analysis",
    "research",
    "machine-learning",
]

classifiers = [
    "Development Status :: 3 - Alpha",

    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",

    "License :: OSI Approved :: MIT License",

    "Operating System :: OS Independent",

    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",

    "Typing :: Typed",

    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26",
    "networkx>=3.0",
    "pandas>=2.0",
    "python-igraph>=0.11",
    "leidenalg>=0.10,<1",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "infomap>=2.7",
    "umap-learn>=0.5",


]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
    "black",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/sahrayi/graphion"
Repository = "https://github.com/sahrayi/graphion"
Issues = "https://github.com/sahrayi/graphion/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.package-data]
graphion = [
    "py.typed",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = [
    "tests",
]

pythonpath = [
    "src",
]

addopts = [
    "-ra",
    "--strict-markers",
]


[tool.black]
line-length = 88
target-version = ["py311"]


[tool.ruff]
line-length = 88
target-version = "py311"


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.mypy]
python_version = "3.11"

strict = true

warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

show_error_codes = true

pretty = true

show_column_numbers = true